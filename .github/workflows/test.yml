name: test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.check }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { check: compiler, target: compiler-test, os: ubuntu-latest }
          - { check: compiler, target: compiler-test, os: macos-latest }
          - { check: byspel, target: byspel-test, os: ubuntu-latest }
          - { check: byspel, target: byspel-test, os: macos-latest }
          - { check: editor, target: editor-test, os: ubuntu-latest }
          - { check: tidy, target: tidy-check, os: ubuntu-latest }
          - { check: prose, target: prose-test, os: ubuntu-latest }
          - { check: formula, target: formula-check, os: ubuntu-latest }

    steps:
      - name: check out source
        uses: actions/checkout@v6

      # the command line tools may ship a newer sdk than their linker readeth;
      # xcode's toolchain keepeth the sdk and linker matched.
      - name: use xcode's toolchain
        if: runner.os == 'macOS'
        run: echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> "$GITHUB_ENV"

      - name: set up haskell
        if: matrix.check == 'compiler' || matrix.check == 'editor' || matrix.check == 'byspel' || matrix.check == 'tidy'
        uses: haskell-actions/setup@v2
        with:
          ghc-version: 9.12.4
          cabal-version: 3.16.1.0

      - name: set up node
        if: matrix.check == 'editor' || matrix.check == 'prose' || matrix.check == 'byspel'
        uses: actions/setup-node@v6
        with:
          node-version: 26.4.0
          cache: npm

      - name: set up ormolu
        if: matrix.check == 'tidy'
        run: cabal install ormolu --install-method=copy --installdir="$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: set up ruby
        if: matrix.check == 'formula'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      # a slow test group peaketh near 6 GB, so test processes are bounded by
      # the runner's memory: 16 GB on ubuntu, 7 GB on macos.
      - name: run ${{ matrix.check }} tests
        env:
          TUNG_TEST_JOBS: ${{ runner.os == 'macOS' && 1 || 2 }}
        run: make ${{ matrix.target }}
