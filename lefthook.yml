pre-commit:
  jobs:
    - name: format haskell
      glob: "**/*.hs"
      run: ormolu --mode inplace {staged_files}
      stage_fixed: true

    - name: tidy tung
      glob: "**/*.tung"
      run: cabal run --project-dir=tongue exe:tung -- --tidy {staged_files}
      stage_fixed: true

    - name: format markdown
      glob: "**/*.md"
      run: prettier --write {staged_files}
      stage_fixed: true
